<!DOCTYPE html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bamba • Admin</title><link rel="stylesheet" href="style.css"></head><body class="admin-login"><main class="login-shell"><div class="login-brand">Bamba <span>Admin</span></div><div class="form-card"><span class="eyebrow">PRIVATE AREA</span><h1>ადმინისტრატორის შესვლა</h1><p class="muted">ეს გვერდი მხოლოდ Bamba-ს ადმინისტრატორისთვისაა.</p><form id="adminLogin"><input id="username" placeholder="მომხმარებელი" autocomplete="username" required><input id="password" type="password" placeholder="პაროლი" autocomplete="current-password" required><button class="btn-main">შესვლა</button><p id="loginError" class="error"></p></form></div><a class="back-home" href="index.html">← მთავარზე დაბრუნება</a></main><script>adminLogin.onsubmit=async e=>{e.preventDefault();loginError.textContent='';const b=e.target.querySelector('button');b.disabled=true;b.textContent='მოწმდება...';try{const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});if(!r.ok){const d=await r.json();throw new Error(d.error||'შესვლა ვერ მოხერხდა')}location.href='dashboard.html'}catch(err){loginError.textContent=err.message}finally{b.disabled=false;b.textContent='შესვლა'}};</script></body></html>
