<!DOCTYPE html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bamba • კონტაქტი</title><link rel="stylesheet" href="style.css"></head><body><header><div class="nav-container"><a href="index.html" class="logo">Bamba <span>•</span></a><button class="burger" id="burgerBtn">☰</button><nav id="navMenu"><a href="index.html" class="">მთავარი</a><a href="menu.html" class="">მენიუ</a><a href="cart.html" class="">კალათა (<span id="cartCount">0</span>)</a><a href="favorite.html" class="">ფავორიტები (<span id="favCount">0</span>)</a><a href="contactus.html" class="contact-link">კონტაქტი</a><a href="auth.html" class="" id="authLink">შესვლა</a></nav><button id="themeToggle" class="theme-btn">🌙</button></div></header><main class="container page"><div class="section-head"><span>CONTACT US</span><h1>დაგვიკავშირდი</h1><p>გაქვს კითხვა? მოგვწერე.</p></div><form id="contactForm" class="form-card contact-form"><input id="contactName" placeholder="სახელი" required><input id="contactEmail" type="email" placeholder="ელ-ფოსტა" required><textarea id="contactMessage" placeholder="შეტყობინება..." required></textarea><button class="btn-main">გაგზავნა</button><p id="contactStatus"></p></form></main><footer><div class="container"><strong>Bamba</strong><p>კლასიკური გემოები და თანამედროვე კომფორტი.</p><small>© 2026 Bamba Restaurant</small></div></footer><script src="bamba-data.js"></script><script src="bamba.js"></script><script>document.querySelector('#contactForm').onsubmit=async e=>{e.preventDefault();const s=document.querySelector('#contactStatus');try{const r=await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:contactName.value,email:contactEmail.value,message:contactMessage.value})});if(!r.ok)throw 0;s.textContent='შეტყობინება წარმატებით გაიგზავნა.';e.target.reset()}catch{s.textContent='შეტყობინების გაგზავნა ვერ მოხერხდა.'}};</script></body></html>
