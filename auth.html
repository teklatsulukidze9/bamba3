<!DOCTYPE html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bamba • შესვლა</title><link rel="stylesheet" href="style.css"></head><body><header><div class="nav-container"><a href="index.html" class="logo">Bamba <span>•</span></a><button class="burger" id="burgerBtn">☰</button><nav id="navMenu"><a href="index.html" class="">მთავარი</a><a href="menu.html" class="">მენიუ</a><a href="cart.html" class="">კალათა (<span id="cartCount">0</span>)</a><a href="favorite.html" class="">ფავორიტები (<span id="favCount">0</span>)</a><a href="contactus.html" class="contact-link">კონტაქტი</a><a href="auth.html" class="active" id="authLink">შესვლა</a></nav><button id="themeToggle" class="theme-btn">🌙</button></div></header><main class="container page narrow"><div class="form-card"><span class="eyebrow">BAMBA</span><h1>მომხმარებლის შესვლა</h1><p class="muted">შეინახე შენი სახელი შეკვეთებისთვის.</p><form id="userForm"><input id="userName" placeholder="სახელი" required><input id="userEmail" type="email" placeholder="ელ-ფოსტა" required><button class="btn-main">შესვლა</button></form></div></main><footer><div class="container"><strong>Bamba</strong><p>კლასიკური გემოები და თანამედროვე კომფორტი.</p><small>© 2026 Bamba Restaurant</small></div></footer><script src="bamba.js"></script><script>userForm.onsubmit=e=>{e.preventDefault();localStorage.setItem('customer',JSON.stringify({name:userName.value,email:userEmail.value}));alert('კეთილი იყოს შენი მობრძანება, '+userName.value+'!');location.href='index.html'};</script></body></html>
