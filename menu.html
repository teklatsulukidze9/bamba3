<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bamba • მენიუ</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="nav-container">
    <a href="index.html" class="logo">Bamba <span>•</span></a>

    <button class="burger" id="burgerBtn">☰</button>

    <nav id="navMenu">
      <a href="index.html">მთავარი</a>
      <a href="menu.html" class="active">მენიუ</a>
      <a href="cart.html">კალათა (<span id="cartCount">0</span>)</a>
      <a href="favorite.html">ფავორიტები (<span id="favCount">0</span>)</a>
      <a href="contactus.html" class="contact-link">კონტაქტი</a>
      <a href="auth.html" id="authLink">შესვლა</a>
    </nav>

    <button id="themeToggle" class="theme-btn">🌙</button>
  </div>
</header>

<main class="container page">

  <div class="page-head">
    <span class="eyebrow">BAMBA</span>
    <h1>ჩვენი მენიუ</h1>
    <p class="muted">აღმოაჩინე Bamba-ს საყვარელი კერძები.</p>
  </div>

  <div id="bcats" class="category-filters"></div>

  <div class="search-box">
    <input
      type="search"
      id="menuSearch"
      placeholder="მოძებნე კერძი..."
    >
  </div>

  <section id="menuGrid" class="grid"></section>

</main>

<footer>
  <div class="container">
    <strong>Bamba</strong>
    <p>კლასიკური გემოები და თანამედროვე კომფორტი.</p>
    <small>© 2026 Bamba Restaurant</small>
  </div>
</footer>

<script src="bamba-data.js"></script>

<script>
const grid = document.getElementById("menuGrid");
const search = document.getElementById("menuSearch");

function showMenu(items) {
  grid.innerHTML = items.map(item => `
    <article class="menu-card">
      <img src="${item.i || item.img || ''}" alt="${item.e || item.n || 'Bamba'}">
      <div class="menu-card-content">
        <h3>${item.e || item.n || ''}</h3>
        <p>${item.n || ''}</p>
        <strong>${item.p || 0} ₾</strong>
      </div>
    </article>
  `).join("");
}

showMenu(typeof BMENU !== "undefined" ? BMENU : []);

search.addEventListener("input", () => {
  const q = search.value.toLowerCase().trim();

  const filtered = BMENU.filter(item =>
    (item.e || "").toLowerCase().includes(q) ||
    (item.n || "").toLowerCase().includes(q)
  );

  showMenu(filtered);
});
</script>

</body>
</html>
